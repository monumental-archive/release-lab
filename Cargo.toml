[workspace]
resolver = "2"
members = [
  "crates/lab-core",
  "crates/lab-cli",
  "crates/lab-wasm",
  "crates/lab-pg",
]
# lab-pg builds only inside its Postgres container (pgrx); the rust-crate
# and rust-binary classes exclude it via the caller's `exclude` input, and
# the local test task mirrors that.
default-members = ["crates/lab-core", "crates/lab-cli", "crates/lab-wasm"]

[workspace.package]
version = "0.28.2"
# npm provenance validates package.json's repository against the caller
# repo; wasm-pack copies it from here. Canon shape: inherited, once.
repository = "https://github.com/monumental-archive/release-lab"
edition = "2021"
license = "MIT OR Apache-2.0"
# The MSRV a consumer reads, and the one clippy's `incompatible_msrv`
# checks against: it defaults to this field rather than to a number in
# clippy.toml, so the manifest stays the single source (canon #445).
# Equal to the pinned toolchain — this workspace is built with exactly
# one rustc and claims no compatibility it does not test.
rust-version = "1.97"
# `clippy::cargo_common_metadata` wants every published crate to carry
# what a crates.io reader needs. Inherited once here rather than repeated
# four times; `description` stays per-crate, being the only one that
# differs between them.
readme = "README.md"
keywords = ["fixture", "release", "provenance", "slsa"]
categories = ["development-tools"]

# Canonical shape (org release canon, docs/release.md in .github): internal
# dependency constraints live here, paired path + version, so the shared
# prepare-release.sh finds every place the version exists in one file.
[workspace.dependencies]
lab-core = { path = "crates/lab-core", version = "0.28.2" }
