# Repo-specific tools and tasks only; the org belt arrives globally.
# ci is assembled by the toolbelt: define test/build/lint:* tasks here
# and they are collected automatically.

[settings]
lockfile = true

[env]
# Which nightly audit:fuzz runs the sanitized targets under (.github#445).
# AddressSanitizer is cargo-fuzz's default and needs -Zsanitizer, which
# stable refuses; the task selects this by name and never guesses. Dated,
# never bare "nightly" — a moving channel is not a pinned input, and this
# is the one pin in the org Renovate cannot bump.
FUZZ_TOOLCHAIN = "nightly-2026-07-20"
# How long each target fuzzes on the Monday cron. 300 rather than the
# 60s floor: --careful buys extra checks per execution at roughly a
# fifth of the throughput, and on a weekly cron for a public repo the
# minutes are free — so buy the checks and the coverage, not one of them.
FUZZ_SECONDS = "300"

# mise's `[task_config]` governs the file it is written in and layers
# nowhere, so the canon's copy covers the belt's own bodies and reaches
# none of yours. The belt sets the same string as mise's default inline
# shell, which covers the gate and any machine wearing the belt; this
# line is what makes the file true without that layer — a bare clone, or
# anything that runs `mise run` without the belt in front of it.
#
# Not cosmetic. mise's own default is `sh`, which is dash on an Ubuntu
# runner: `[[ ]]` and `<<<` are syntax errors, and — the quiet half — a
# failing command inside a pipeline does not fail the task, so a check
# goes green having not checked. `lint:belt-shell` reds a config that
# defines tasks and omits this.
[task_config]
shell = "bash -euo pipefail -c"

[tools]
"aqua:rustwasm/wasm-pack" = "0.15.1"
node = "24.22.2"
# Two toolchains, both locked by mise. The stable pin is what everything
# builds and releases with; the dated nightly exists solely so audit:fuzz
# can run libFuzzer under AddressSanitizer on the cron, which the gate
# never touches. Components ride the pin so they install before any task
# runs — never mid-run rustup: coverage:check asserts llvm-tools,
# lint:rust asserts clippy and rustfmt.
rust = [
  { version = "1.99.1", components = "clippy,rustfmt,llvm-tools" },
  # rust-src is not optional on the nightly: audit:fuzz runs `--careful`,
  # which implies -Zbuild-std, which rebuilds the standard library from
  # source and fails without it. Components ride the pin here for the
  # same reason they do above — installed before any task runs.
  { version = "nightly-2026-07-20", components = "rust-src" },
  # The MSRV toolchain: Cargo.toml promises rust-version 1.97 and every
  # member inherits it, so lint:msrv compiles at exactly that version
  # rather than trusting the stable pin to stand in for it (#270). Move
  # this line and rust-version together, never one alone.
  { version = "1.97.0" },
]
# Build input of the pgrx-extension class; must match the pgrx crate dep.
"cargo:cargo-pgrx" = "0.19.3"
# The Postgres lab-pg is compiled and tested against in the gate, one
# entry per major the crate's features declare (.github#813). The belt
# derives the majors from Cargo.toml and reds if a declared one is not
# pinned here.
"aqua:theseus-rs/postgresql-binaries" = [
  "18.6.1",
  "17.11.1",
  "16.15.1",
  "15.19.1",
  "14.24.1",
]
# ICU's headers, for building lab-pg on a Mac: the prebuilt Postgres is
# built against ICU and ships no headers, and pgrx binds every Postgres
# header from 0.19.3 (.github tooling-verdicts). macOS only — the runner
# has libicu-dev. The belt holds this to the major Postgres was built
# against, so it moves with the Postgres pin above, never on its own.
"github:unicode-org/icu" = { version = "78.3", version_prefix = "release-", asset_pattern = "icu4c-*-sources.tgz", os = [
  "macos",
] }
# Build input of the rust build classes: auditable binaries (.dep-v0).
"cargo:cargo-auditable" = "0.7.7"
# Build input of lint:fuzz-build / audit:fuzz (.github#316); cargo
# backend like cargo-pgrx, sanitizer-none on the stable pin.
"cargo:cargo-fuzz" = "0.13.2"

[tasks.test]
description = "The fixture crates must build and pass — they are what the shared workflows execute against"
run = "cargo test --workspace --locked --exclude lab-pg"
