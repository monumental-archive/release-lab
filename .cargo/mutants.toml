# Mutation testing (canon #1355): tracking this file adopts the belt's
# `audit:mutants` Rust leg, run weekly by .github/workflows/mutants.yml
# (the canon's repo-mutants.yml) and never in the gate or the audit.
# The measure is no unexplained surviving mutant: kill a survivor with
# an assertion, or record it below as an `exclude_re` entry with a `#`
# line above it saying why the mutant is equivalent. Never
# `#[mutants::skip]` (a dependency in shipped code).

exclude_re = [
  # lab-pg's `tests::` functions are test code: pgrx compiles its
  # #[pg_test] module under `cfg(any(test, feature = "pg_test"))`, which
  # cargo-mutants' own test filter (it skips `#[test]` and `cfg(test)`)
  # does not recognise, so it mutates the tests themselves.
  '^crates/lab-pg/src/lib\.rs:[0-9]+:[0-9]+: replace (tests::|.* in tests::)',
]
