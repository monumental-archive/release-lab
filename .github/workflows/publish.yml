# Release phase 2. THE FILENAME IS CANON — both registries pin the caller's
# entry workflow filename from the `workflow_ref` claim, so renaming this
# breaks trusted publishing with nothing local going red.
#
# The lab runs it as a rehearsal: everything happens except the crates.io
# upload, and the release is left a draft.
---
name: publish

"on":
  push:
    tags:
      - v*

  # Resume path. ALWAYS dispatch with --ref <tag>; the shared guard refuses
  # anything that is not a tag, because a branch ref would attest a moving
  # pointer and Sigstore is append-only.
  workflow_dispatch: {}

permissions: {}

# Never cancel a publish mid-flight; queue instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: monumental-archive/.github/.github/workflows/publish.yml@f0694b0f2bf8a960f7bd139b475c3486d25ac924 # v1.59.0
    with:
      # The width proof, real: every class but rust-crate (the lab never
      # uploads to crates.io — that class's coexistence and dry-run shape
      # were proven on v0.15.3), every supported PG major for real. npm,
      # GHCR, per-major extension images, real version DOI, immutable release.
      #
      # RESTORED after the oci-image-only cell (#253). v0.28.0 published
      # with `classes: oci-image` alone — the class-alone path, which no
      # full-width run can exercise, because the rust-binary leg carries
      # an inventory plan and the aggregator therefore never takes the
      # branch that refused iiif-server v0.2.0 (.github#773). It
      # published: sbom-image-lab-cli-0.28.0.spdx.json beside the union,
      # per-arch digests reproduced, verdict signed. Cutting the cell
      # again is one line and this comment.
      classes: rust-binary,oci-image,wasm-npm,pgrx-extension
      smoke-test: scripts/image-smoke.sh
      # Declared, not scripted (.github#775): the class builds this crate
      # through the same definition the rust-binary class compiles with
      # and installs it at dist/lab-cli, which is what the Dockerfile
      # already COPYs. This is also .github#775's own consequence for
      # this repository — the prepare script it replaces was the same
      # twenty-five lines iiif-server had written, with one binary name
      # changed. It stays declared when full width is restored; only the
      # `classes:` line moves back.
      binary-crate: crates/lab-cli
      binary-smoke-test: scripts/binary-smoke.sh
      exclude: lab-pg
      crate-dir: crates/lab-wasm
      npm-scope: monumental-archive
      extension-crate-dir: crates/lab-pg
      pg-majors: 14,15,16,17,18
      mint-doi: true
      dry-run: false # the full-width proof in substance
    permissions:
      # The union every nested job needs. A reusable workflow can only
      # reduce what the caller grants, so a missing scope here kills the
      # run as startup_failure with no jobs and no log.
      contents: read # build and publish check out this repository
      id-token: write # crates.io trusted publishing, and the signer
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record
      packages: write # oci-image pushes per-arch images and the manifest
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
      zenodo-token: ${{ secrets.ZENODO_TOKEN }}
...
