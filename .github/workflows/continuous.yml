# The continuous archetype: digest publish on merge, weekly rebuild, no
# tags, no versions. In the LAB this coexists with the versioned caller
# deliberately: the same repository proves both archetypes, and the
# continuous guard refusing tags while publish.yml refuses branches is
# the pair of inverse guards doing their jobs.
---
name: continuous

"on":
  push:
    branches:
      - main

  schedule:
    # Wednesdays 06:00 UTC — the weekly remediation rebuild, refreshing
    # every base layer nothing can pin.
    - cron: 0 6 * * 3
  workflow_dispatch: {}
permissions: {}

# Never two publishes racing; a fresher merge supersedes a queued rebuild.
concurrency:
  group: continuous-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: monumental-archive/.github/.github/workflows/continuous.yml@38eb388e9fb67ee13216dff37a1d0757851f8f15 # v1.79.0
    with:
      smoke-test: scripts/image-smoke.sh
      # Declared, not scripted (.github#775) — the same input the publish
      # stub carries. This archetype reuses the oci-image class's build
      # wholesale, so an input the class takes and this stub drops is a
      # Dockerfile whose COPY source never gets staged (.github#302).
      binary-crate: crates/lab-cli
    permissions:
      contents: read # this repository's contents, read-only
      packages: write # this repository's packages, read and write
      id-token: write # an OIDC token for this run
      attestations: write # this repository's attestations, read and write
      artifact-metadata: write # this repository's artifact storage records, read and write
      issues: write # the callee's report job: its workflow's red-check issue (#1887)
      actions: read # the callee's report job: the run's job list and job logs (#1887)
...
