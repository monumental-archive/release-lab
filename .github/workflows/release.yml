# Release phase 1. This stub is a versioned repo's entire release-PR
# obligation: version decision, changelog, Release PR, and — on merge —
# the App-minted v* tag and draft release, all via the shared workflow.
# Phase 2 (this repository's own publish workflow, triggered by the tag)
# builds, proves and signs. See docs/release.md in monumental-archive/.github.
---
name: release

"on":
  push:
    branches:
      - main

  # Refresh the open Release PR when a publish completes. The PR is
  # opened on the push of the PREVIOUS release commit — before that
  # release has finished publishing — so anything derived from "the
  # published release" starts from a version about to be superseded.
  # Measured here on v0.24.3: the PR was created at 11:04 against
  # v0.24.1, v0.24.2 published at 11:11, and the merge four hours later
  # carried an upgrade path from the wrong version, burning the tag
  # (.github#358 seam 5). This re-derives it when the publish lands.
  release:
    types:
      - published

  # Recovery path: re-run the tag step against a release commit whose first
  # attempt failed. The shared workflow refuses anything else.
  workflow_dispatch: {}

permissions: {}

# Never cancel a release mid-flight; queue instead — and the group is the
# WORKFLOW, never the commit: the Release-PR machinery works on two fixed
# branches, so per-commit keying let two merges race and killed one
# mid-script on a 403 (.github#316, measured here 2026-08-13).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    uses: monumental-archive/.github/.github/workflows/release.yml@f0694b0f2bf8a960f7bd139b475c3486d25ac924 # v1.59.0
    permissions:
      # Required. A uses: job with no permissions block takes the
      # WORKFLOW-level default, not some ambient grant — and the shared
      # workflow needs this to read the commits it derives the version
      # from. Omitting it kills the run as startup_failure with no jobs
      # and no log.
      contents: read # the version derivation's history read, and the checkout
      # Passed through to release.yml's tag job, where gitsign spends it
      # on the keyless tag signature (.github#349 S4). New in canon
      # v1.23.1: a caller must grant at least what the callee's jobs
      # ask for, so the pin bump alone startup-failed this workflow in
      # 1s with no jobs and no log (.github#354, measured here).
      id-token: write # gitsign's keyless signature on the release tag
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
...
