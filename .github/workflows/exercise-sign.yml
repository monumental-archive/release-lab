# Exercises the org signing workflow across a repository boundary, which
# is the only way it gets tested: a shared workflow whose sole caller lives
# in its own repository is untested for exactly the case every consumer
# runs. This lab caught four defects that way before any production
# repository was touched.
#
# Three jobs, in the canonical order: a build that produces bytes and
# hashes them, the signer that never sees the bytes, and a verification
# performed the way a stranger would perform it.
---
name: exercise-sign

# Run on demand. Not on push: every run mints a real Sigstore entry, and
# the transparency log is append-only — proof should be deliberate, not a
# by-product of touching this repository.
"on":
  workflow_dispatch: {}
permissions: {}

# A measurement is worth cancelling: only the newest push tells you
# anything, unlike a release, which is queued and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Produce fixtures and declare their digests
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - name: Produce two fixture artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          # Two subjects, not one: a manifest that only ever carries a
          # single line would not exercise the multi-subject path that
          # every real release uses.
          printf 'lab fixture one, run %s\n' "${GITHUB_RUN_ID}" > out/fixture-one.txt
          printf 'lab fixture two, run %s\n' "${GITHUB_RUN_ID}" > out/fixture-two.txt
      - name: Compute the subject manifest
        id: hash
        run: |
          set -euo pipefail
          cd out
          manifest=$(sha256sum fixture-one.txt fixture-two.txt)
          {
            echo "subjects<<SUBJECTS_EOF"
            printf '%s\n' "${manifest}"
            echo "SUBJECTS_EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${manifest}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-fixtures
          path: out/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign
    needs: build
    # Pinned by full SHA, like every caller must. This line is the ONE
    # statement of the trusted signer in this tree: the verification below
    # derives --signer-digest from it at run time (verify-signed reads this
    # file at the running commit), so the two halves of the identity are
    # proven together by construction rather than kept in agreement by
    # hand. The previous shape — the digest repeated as a literal in the
    # verify commands — sat frozen at the signer's first commit while this
    # line was bumped twice (#314). No repo carries a second copy any more:
    # the canon's own security/signer.pin went the same way once its
    # Renovate manager split every bump into two unmergeable branches
    # (.github#316 finding 2) — the uses: line is the single statement
    # of the trusted signer everywhere, and everything derives from it.
    uses: monumental-archive/signer/.github/workflows/sign.yml@13e7af042db9f4b5390b37008db470bb5f3e96f9 # main
    with:
      subjects: ${{ needs.build.outputs.subjects }}
    permissions:
      # Exactly the three the signer declares. Requesting fewer kills the
      # run as startup_failure with no jobs and no log, so this list is
      # part of the contract, not an implementation detail.
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record

  verify:
    name: Verify as a stranger would
    needs:
      - build
      - sign

    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lab-fixtures
          path: out

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.bundle-artifact }}
          path: bundle

      # Both verifications pin --signer-workflow (the path, a prefix
      # regex) and --signer-digest (OID .10, the signer commit) — the
      # digest derived from this file's own sign.yml uses: line, never
      # written by hand (#314; lint:signer-pin reddens a literal).
      - name: Verify against GitHub's stored attestation
        uses: monumental-archive/.github/.github/actions/verify-signed@f0694b0f2bf8a960f7bd139b475c3486d25ac924 # v1.59.0
        with:
          files: out/fixture-one.txt out/fixture-two.txt

      - name: Locate the returned bundle
        id: bundle
        run: |
          set -euo pipefail
          bundle=$(find bundle -name '*.jsonl' -o -name '*.json' | head -n 1)
          echo "bundle: ${bundle}"
          echo "path=${bundle}" >> "${GITHUB_OUTPUT}"
      - name: Verify offline against the returned bundle
        uses: monumental-archive/.github/.github/actions/verify-signed@f0694b0f2bf8a960f7bd139b475c3486d25ac924 # v1.59.0
        with:
          files: out/fixture-one.txt out/fixture-two.txt
          bundle: ${{ steps.bundle.outputs.path }}
...
