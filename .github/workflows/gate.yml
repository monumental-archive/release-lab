# The org gate. This stub is a repo's entire CI obligation: everything else
# (linters, versions, enforcement) arrives via the shared workflow and the
# toolbelt it pins. Update the SHA when moving to a newer gate; once the
# .github repo cuts releases, Renovate manages this pin like any other.
---
name: gate

"on":
  # `edited` included because the squash subject is the PR title:
  # without it a title edit leaves a stale verdict standing
  # (.github#427).
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

  push:
    branches:
      - main
  # The merge queue runs the gate on its own temporary branch; without
  # this trigger a queued pull request waits for a check that cannot
  # report (monumental-archive/.github#1117, lint:gate-stub).
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      # Stated, not inherited: a uses: job takes the workflow-level
      # default, so a shared workflow that gains a permission breaks
      # every silent caller as startup_failure with no log.
      contents: read # the gate checks out this repo and the toolbelt
    uses: monumental-archive/.github/.github/workflows/ci.yml@c54d16cf20d770a944db997afa533e48a786ee4e # v1.78.4
    secrets:
      # The badge feed, never the gate: absent, the upload job skips
      # clean. Token stays REQUIRED on the Codecov side — tokenless
      # ingest accepts forged reports from anyone (.github#316).
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
...
